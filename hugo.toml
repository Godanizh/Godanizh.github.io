# FixIt 站点配置
# 上线前把 Godanizh 全部替换成你的 GitHub 用户名（或直接跑 .\setup.ps1 -Username xxx）
# 主题参数完整说明：https://fixit.lruihao.cn/zh-cn/docs/getting-started/configuration/
baseURL = "https://godanizh.github.io/"
title = "godanizh的网络安全博客"
theme = "FixIt"
defaultContentLanguage = "zh-cn"
locale = "zh-CN"
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true
# 中文列表标题不做首字母大写
capitalizeListTitles = false

[outputs]
  home = ["HTML", "RSS", "JSON"]

# FixIt 使用 author 分类来生成作者页，缺了会构建报错
[taxonomies]
  category = "categories"
  tag = "tags"
  author = "authors"

[pagination]
  pagerSize = 10

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = true
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[params]
  # FixIt 版本号，仅用于前端提示，保持默认即可
  version = "1.0.X"

  [params.author]
    name = "XXX"
    link = "https://github.com/Godanizh"
    email = ""
    avatar = ""

  # 首页个人卡片
  [params.home.profile]
    enable = true
    title = "你好，我是 XXX"
    subtitle = "记录技术、项目与思考"
    social = true
    typeit = false

  # 首页文章列表
  [params.home.posts]
    enable = true

  # 文章页
  [params.page]
    [params.page.toc]
      enable = true
      keepStatic = true
      auto = false
    [params.page.code]
      copy = true
      maxShownLines = 20
    [params.page.share]
      enable = false

  # 社交图标：键名即图标名，weight 控制排序
  [params.social]
    [params.social.github]
      id = "Godanizh"
      weight = 1
    # [params.social.rss]
    #   id = "index.xml"
    #   weight = 2

  # 评论系统：默认关闭
  # 启用 giscus 的步骤：
  #   1. 仓库 Settings → Features 勾选 Discussions
  #   2. 打开 https://giscus.app/zh-CN ，填仓库名，选分类，复制 repo_id 和 category_id
  #   3. 把下面 enable 改成 true，并填 repo_id / category_id
  [params.comment]
    enable = false
    [params.comment.giscus]
      enable = false
      repo = "Godanizh/Godanizh.github.io"
      repo_id = ""
      category = "Announcements"
      category_id = ""
      mapping = "pathname"
      lang = "zh-CN"
      input_position = "bottom"
      reactions_enabled = "1"
      emit_metadata = "0"

  # Cookie 同意横幅：关掉，纯静态博客没有需要同意的追踪
  [params.cookieconsent]
    enable = false

[[menu.main]]
  name = "文章"
  url = "/posts/"
  weight = 1

[[menu.main]]
  name = "标签"
  url = "/tags/"
  weight = 2

[[menu.main]]
  name = "搜索"
  url = "/search/"
  weight = 3

[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 4
